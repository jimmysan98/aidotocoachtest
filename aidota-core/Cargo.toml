[package]
name = "aidota-core"
version = "1.3.0"
edition = "2021"
authors = ["AIDOTA Team"]
description = "High-performance Rust core and GSI engine for AIDOTA"

[lib]
name = "aidota_rust"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aidota-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
chrono = "0.4"
